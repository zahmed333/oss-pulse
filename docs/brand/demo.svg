<svg xmlns="http://www.w3.org/2000/svg" width="932" height="410" viewBox="0 0 932 410" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" role="img" aria-label="oss-pulse holds a fake take-home assignment">
  <rect width="932" height="410" rx="10" fill="#0d1117"/>
