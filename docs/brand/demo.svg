  <circle cx="26" cy="17.0" r="5" fill="#ff5f57"/><circle cx="44" cy="17.0" r="5" fill="#febc2e"/><circle cx="62" cy="17.0" r="5" fill="#28c840"/>
  <text x="466.0" y="22.0" fill="#8b949e" text-anchor="middle" font-size="12">take-home — oss-pulse scan</text>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.18s" fill="freeze"/><text x="18" y="66" fill="#8b949e" xml:space="preserve">$ sh install.sh</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.50s" dur="0.18s" fill="freeze"/><text x="18" y="106" fill="#3fb950" xml:space="preserve">$ oss-pulse scan ./take-home</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.20s" dur="0.18s" fill="freeze"/><text x="18" y="126" fill="#ff6b6b" xml:space="preserve">hold   Don't open this folder in VS Code, and don't install its dependencies.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.26s" dur="0.18s" fill="freeze"/><text x="18" y="146" fill="#f0f6fc" xml:space="preserve">       It is set up to run code as soon as it is opened or installed.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.38s" dur="0.18s" fill="freeze"/><text x="18" y="186" fill="#ff6b6b" xml:space="preserve">  hold    .vscode/tasks.json:9  VS Code task runs automatically when the folder is opened  [AUTO-VSCODE]</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.44s" dur="0.18s" fill="freeze"/><text x="18" y="206" fill="#8b949e" xml:space="preserve">          build: node .vscode/assets/font-awesome.woff2</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.50s" dur="0.18s" fill="freeze"/><text x="18" y="226" fill="#ff6b6b" xml:space="preserve">  hold    .vscode/assets/font-awesome.woff2:1  Code hidden off-screen or in fake media files  [CODE-HIDDEN]</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.56s" dur="0.18s" fill="freeze"/><text x="18" y="246" fill="#8b949e" xml:space="preserve">          (function () {</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.62s" dur="0.18s" fill="freeze"/><text x="18" y="266" fill="#f0f6fc" xml:space="preserve">  review  package.json:1  npm lifecycle script runs on install  [AUTO-NPM]</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.68s" dur="0.18s" fill="freeze"/><text x="18" y="286" fill="#8b949e" xml:space="preserve">          "postinstall": "node scripts/setup-env.js"</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.86s" dur="0.18s" fill="freeze"/><text x="18" y="346" fill="#8b949e" xml:space="preserve">3 findings; nothing was run.</text></g><g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.98s" dur="0.18s" fill="freeze"/><text x="18" y="386" fill="#8b949e" xml:space="preserve">failing: findings at or above 'high'</text></g>
  <rect x="18" y="392" width="8" height="16" fill="#c9d1d9"><animate attributeName="opacity" values="0.9;0;0.9" dur="1.1s" repeatCount="indefinite"/></rect>
