# Dogfooding: OSS Pulse checks its own repository and dependencies on every PR,
# and weekly (new advisories and hijacks appear without any change on our side).
name: supply-chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  oss-pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          dependency-file: pyproject.toml
          scan-path: .
          ignore-file: .osspulseignore
          fail-on: critical
