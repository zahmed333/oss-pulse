name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check . && ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit + end-to-end tests (synthetic data, fully offline)
        run: pytest -v

  wheel-smoke:
    # Test what users install, not the editable checkout. A fresh install once crashed
    # because the typosquat list and the dbt project were missing from the wheel.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: pip wheel --no-deps -w dist .
      - run: python -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
      - name: scan works from the wheel and blocks an auto-run task
        run: |
          trap_dir="$RUNNER_TEMP/trap"
          mkdir -p "$trap_dir/.vscode"
          echo '{"version":"2.0.0","tasks":[{"label":"x","type":"shell","command":"echo hi","runOptions":{"runOn":"folderOpen"}}]}' > "$trap_dir/.vscode/tasks.json"
          "$RUNNER_TEMP/venv/bin/oss-pulse" scan . --fail-on high --ignore-file .osspulseignore
          if "$RUNNER_TEMP/venv/bin/oss-pulse" scan "$trap_dir" --fail-on high; then
            echo "the auto-run task was not blocked"; exit 1
          fi
      - name: the slim install has no data pipeline, and check says how to add it
        run: |
          if "$RUNNER_TEMP/venv/bin/python" -c "import duckdb" 2>/dev/null; then
            echo "the slim install pulled in duckdb"; exit 1
          fi
          set +e
          "$RUNNER_TEMP/venv/bin/oss-pulse" check pyproject.toml 2> "$RUNNER_TEMP/check.err"
          test $? -eq 2 && grep -q "oss-pulse\[check\]" "$RUNNER_TEMP/check.err"
      - name: JUnit and SARIF outputs are valid
        run: |
          "$RUNNER_TEMP/venv/bin/oss-pulse" scan . --ignore-file .osspulseignore --annotations none \
            --junit "$RUNNER_TEMP/scan.xml" --sarif "$RUNNER_TEMP/scan.sarif"
          python -c "import sys, json, xml.etree.ElementTree as E; E.parse(sys.argv[1]); assert json.load(open(sys.argv[2]))['version'] == '2.1.0'" "$RUNNER_TEMP/scan.xml" "$RUNNER_TEMP/scan.sarif"
      - name: check runs the dbt project bundled in the wheel
        run: |
          "$RUNNER_TEMP/venv/bin/pip" install "$(ls dist/*.whl)[check]"
          "$RUNNER_TEMP/venv/bin/oss-pulse" check pyproject.toml --data-dir "$RUNNER_TEMP/lake" --no-scan-artifacts --fail-on never
          site=$("$RUNNER_TEMP/venv/bin/python" -c "import oss_pulse, pathlib; print(pathlib.Path(oss_pulse.__file__).parent)")
          test ! -e "$site/dbt_project/target" && test ! -e "$site/dbt_project/logs"

  dbt-and-dagster:
    runs-on: ubuntu-latest
    env:
      OSS_PULSE_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev,orchestration]"
      - name: Full pipeline demo
        run: oss-pulse demo --days 10
      - name: Scan this repository for supply-chain red flags
        run: oss-pulse scan . --fail-on high --ignore-file .osspulseignore
      - name: Validate Dagster definitions
        run: dagster definitions validate -m oss_pulse.orchestration.definitions
      - name: Build dbt docs (lineage + catalog)
        working-directory: transform
        run: dbt docs generate --profiles-dir .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbt-docs
          path: |
            transform/target/index.html
            transform/target/manifest.json
            transform/target/catalog.json
