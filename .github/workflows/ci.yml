name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check . && ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit + end-to-end tests (synthetic data, fully offline)
        run: pytest -v

  dbt-and-dagster:
    runs-on: ubuntu-latest
    env:
      OSS_PULSE_DATA_DIR: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev,orchestration]"
      - name: Full pipeline demo
        run: oss-pulse demo --days 10
      - name: Scan this repository for supply-chain red flags
        run: oss-pulse scan . --fail-on high
      - name: Validate Dagster definitions
        run: dagster definitions validate -m oss_pulse.orchestration.definitions
      - name: Build dbt docs (lineage + catalog)
        working-directory: transform
        run: dbt docs generate --profiles-dir .
      - uses: actions/upload-artifact@v4
        with:
          name: dbt-docs
          path: |
            transform/target/index.html
            transform/target/manifest.json
            transform/target/catalog.json
