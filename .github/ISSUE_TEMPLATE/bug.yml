name: Bug
description: A crash, a wrong exit code, or behaviour that doesn't match the docs
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Commit or version, placeholder: "git rev-parse --short HEAD" }
  - type: input
    id: command
    attributes: { label: Command you ran }
    validations: { required: true }
  - type: textarea
    id: output
    attributes: { label: Output, render: text }
    validations: { required: true }
  - type: input
    id: platform
    attributes: { label: OS and Python version }
