[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "oss-pulse"
version = "0.1.0"
description = "An open-source ecosystem health lakehouse: GH Archive + PyPI -> Parquet -> dbt/DuckDB -> health metrics."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6",
    "packaging>=23",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
orchestration = ["dagster>=1.9", "dagster-dbt>=0.25", "dagster-webserver>=1.9"]
dashboard = ["streamlit>=1.38"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
oss-pulse = "oss_pulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_pulse"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option(...) defaults are the idiomatic Typer API

[tool.ruff.lint.per-file-ignores]
"src/oss_pulse/supplychain/rules.py" = ["E501"]  # human-readable catalogue strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.dagster]
module_name = "oss_pulse.orchestration.definitions"
