[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "oss-pulse"
version = "0.1.0"
description = "Scan a repository or your Python dependencies for supply-chain malware before you run them: fake interview take-homes, typosquats, hijacked PyPI releases."
authors = [{ name = "zahmed333" }]
keywords = ["supply-chain-security", "malware-detection", "typosquatting", "pypi", "dependency-confusion", "github-actions", "vscode", "contagious-interview", "trusted-publishing", "pep-740", "sbom", "devsecops", "dbt", "duckdb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.1",
    "pyarrow>=17",
    "httpx>=0.27",
    "typer>=0.12",
    "pyyaml>=6",
    "packaging>=23",
    "dbt-core>=1.9",
    "dbt-duckdb>=1.9",
]

[project.urls]
Homepage = "https://github.com/zahmed333/oss-pulse"
Documentation = "https://github.com/zahmed333/oss-pulse#readme"
Issues = "https://github.com/zahmed333/oss-pulse/issues"
Changelog = "https://github.com/zahmed333/oss-pulse/commits/main"

[project.optional-dependencies]
orchestration = ["dagster>=1.9", "dagster-dbt>=0.25", "dagster-webserver>=1.9"]
dashboard = ["streamlit>=1.38"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
oss-pulse = "oss_pulse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_pulse"]

# `check` runs the dbt project at runtime, so it ships inside the wheel. Build output
# (target/, logs/) never does: dbt writes those under the data directory instead.
[tool.hatch.build.targets.wheel.force-include]
"transform/dbt_project.yml" = "oss_pulse/dbt_project/dbt_project.yml"
"transform/profiles.yml" = "oss_pulse/dbt_project/profiles.yml"
"transform/models" = "oss_pulse/dbt_project/models"
"transform/macros" = "oss_pulse/dbt_project/macros"
"transform/tests" = "oss_pulse/dbt_project/tests"
"tracked_projects.yml" = "oss_pulse/tracked_projects.yml"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # typer.Option(...) defaults are the idiomatic Typer API

[tool.ruff.lint.per-file-ignores]
"src/oss_pulse/supplychain/rules.py" = ["E501"]  # human-readable catalogue strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.dagster]
module_name = "oss_pulse.orchestration.definitions"
